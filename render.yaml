services:
  - type: web
    name: anemialens-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ANEMIALENS_MISTRAL_API_KEY
        sync: false
      - key: ANEMIALENS_MISTRAL_ENABLED
        value: "true"
      - key: ANEMIALENS_MISTRAL_MODEL
        value: "mistral-small-latest"
      - key: ANEMIALENS_GUIDANCE_TIMEOUT
        value: "20"
      - key: PORT
        value: "5000"
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ANEMIALENS_CORS_ORIGINS
        value: '["https://anemia-lens.vercel.app"]'
