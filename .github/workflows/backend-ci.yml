name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

env:
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '1.7.1'

jobs:
  lint:
    name: 🔍 Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: 🔎 Run Ruff linter
        working-directory: ./backend
        run: |
          ruff check app/ tests/ --output-format=github

      - name: 🎨 Check code formatting
        working-directory: ./backend
        run: |
          ruff format app/ tests/ --check --diff

      - name: 🔒 Security scan with Bandit
        working-directory: ./backend
        run: |
          pip install bandit
          bandit -r app/ -f json -o bandit-report.json || true
          bandit -r app/ -ll

  test:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        test-group: [unit, integration, e2e]
      fail-fast: false

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: 🔧 Create .env file
        working-directory: ./backend
        run: |
          cp .env.example .env
          echo "JWT_SECRET_KEY=test-secret-key-for-ci" >> .env
          echo "ENVIRONMENT=test" >> .env
          echo "DATABASE_URL=sqlite+aiosqlite:///./test.db" >> .env

      - name: 🧪 Run tests
        working-directory: ./backend
        env:
          JWT_SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
        run: |
          if [ "${{ matrix.test-group }}" = "unit" ]; then
            pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=term-missing
          elif [ "${{ matrix.test-group }}" = "integration" ]; then
            pytest tests/integration/ -v --cov=app --cov-report=xml --cov-report=term-missing
          else
            pytest tests/e2e/ -v --cov=app --cov-report=xml --cov-report=term-missing
          fi

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend,${{ matrix.test-group }}
          name: backend-${{ matrix.test-group }}
          fail_ci_if_error: false

  security:
    name: 🔒 Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔒 Run Safety check for vulnerable dependencies
        working-directory: ./backend
        run: |
          pip install safety
          safety check -r requirements.txt --json --output safety-report.json || true
          safety check -r requirements.txt

      - name: 🔍 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 📤 Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  build:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test, security]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker image
        run: |
          docker build -t anemialens-backend:${{ github.sha }} ./backend

      - name: 🧪 Test Docker image
        run: |
          docker run --rm anemialens-backend:${{ github.sha }} python --version

      - name: 📦 Push to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo $GITHUB_TOKEN | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag anemialens-backend:${{ github.sha }} ghcr.io/${{ github.repository }}/backend:latest
          docker tag anemialens-backend:${{ github.sha }} ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/backend:latest
          docker push ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
