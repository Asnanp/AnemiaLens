  <text x="158" y="240" fill="#DCE3F7" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="600">LIVE PRODUCT · SCREENING WORKFLOW</text>

  <text x="108" y="338" fill="#F9FAFF" font-family="Georgia, Times New Roman, serif" font-size="94" font-weight="700">AI anemia screening</text>
  <text x="108" y="422" fill="#FF5A7C" font-family="Georgia, Times New Roman, serif" font-size="94" font-weight="700">from a smartphone eye image.</text>

  <text x="108" y="494" fill="#C6CCDE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="31" font-weight="500">
    Quality-gated capture. Calibrated risk scoring. Mistral-powered guidance.
  </text>
  <text x="108" y="538" fill="#9199AF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">
