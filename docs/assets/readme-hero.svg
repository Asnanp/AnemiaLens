  <text x="852" y="252" fill="#A3ACC4" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" font-weight="600">SCREENING BAND</text>
  <text x="852" y="308" fill="#F5F7FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="800">Moderate</text>
  <text x="852" y="336" fill="#FF6384" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Risk</text>

  <rect x="1028" y="214" width="230" height="130" rx="22" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <text x="1056" y="252" fill="#A3ACC4" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" font-weight="600">CONFIDENCE + TRUST</text>
  <text x="1056" y="306" fill="#F5F7FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="800">81%</text>
  <text x="1134" y="306" fill="#36D39A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">stable</text>
  <text x="1056" y="334" fill="#8E97AD" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500">confidence is separated from capture reliability</text>

  <rect x="822" y="372" width="436" height="104" rx="22" fill="rgba(255,255,255,0.028)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <text x="852" y="406" fill="#A3ACC4" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" font-weight="600">WHY THIS RESULT</text>
  <text x="852" y="442" fill="#E7EBF8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">
    Conjunctival redness stayed below the concern threshold and
  </text>
  <text x="852" y="472" fill="#E7EBF8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">
    symptom burden did not raise the triage story.
  </text>

  <rect x="822" y="500" width="206" height="88" rx="20" fill="rgba(255,255,255,0.026)" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>
  <text x="850" y="532" fill="#F4AF43" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" font-weight="700">QUALITY CHECK</text>
  <text x="850" y="566" fill="#F2F4FB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Balanced lighting</text>

  <rect x="1050" y="500" width="208" height="88" rx="20" fill="rgba(255,255,255,0.026)" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>
  <text x="1078" y="532" fill="#31D3A2" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" font-weight="700">NEXT STEP</text>
  <text x="1078" y="566" fill="#F2F4FB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Routine follow-up</text>

