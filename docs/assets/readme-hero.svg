    <circle cx="1032" cy="334" r="164" fill="url(#glow)"/>
  </g>

  <rect x="782" y="122" width="516" height="500" rx="30" fill="url(#panel)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
