  </text>

  <rect x="108" y="588" width="284" height="60" rx="30" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
  <text x="250" y="625" fill="#F8FAFF" font-family="IBM Plex Mono, Consolas, monospace" font-size="20" font-weight="500" text-anchor="middle">anemia-lens.vercel.app</text>

