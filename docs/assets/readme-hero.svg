  <text x="226" y="132" fill="#F4F7FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="800">Anemia</text>
  <text x="408" y="132" fill="#FF4A70" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="800">Lens</text>

  <rect x="108" y="214" width="218" height="40" rx="20" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
