<svg width="1440" height="520" viewBox="0 0 1440 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="1260" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090A12"/>
      <stop offset="1" stop-color="#04040A"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="480" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF5A7C"/>
      <stop offset="1" stop-color="#F0A146"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="520" rx="34" fill="url(#bg)"/>
  <rect x="26" y="26" width="1388" height="468" rx="28" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <text x="70" y="84" fill="#F6F8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Why the product feels stronger than a simple demo</text>
  <text x="70" y="120" fill="#98A0B7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500">The UX is built around trust, not just a prediction number.</text>

  <g transform="translate(70 162)">
    <rect width="402" height="282" rx="26" fill="rgba(255,255,255,0.03)" stroke="url(#edge)" stroke-opacity="0.28" stroke-width="1.5"/>
    <text x="32" y="42" fill="#FF6384" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" font-weight="700">1 · QUALITY GATE</text>
    <text x="32" y="96" fill="#F6F8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">The image is checked before the result is trusted.</text>
    <text x="32" y="166" fill="#B5BDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500">Blur, brightness, glare, shadow, and eyelid framing are evaluated so the model can ask for a retake instead of pretending certainty.</text>
  </g>

  <g transform="translate(518 162)">
    <rect width="402" height="282" rx="26" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <text x="32" y="42" fill="#48D5A4" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" font-weight="700">2 · CALIBRATED TRIAGE</text>
    <text x="32" y="96" fill="#F6F8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Confidence and trust level are kept separate on purpose.</text>
    <text x="32" y="166" fill="#B5BDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500">A case can look low-risk while still carrying low reliability if the capture is overexposed or shadow-heavy. That is a safety feature, not a UI bug.</text>
  </g>

  <g transform="translate(966 162)">
    <rect width="402" height="282" rx="26" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <text x="32" y="42" fill="#F0A146" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" font-weight="700">3 · ACTIONABLE OUTPUT</text>
    <text x="32" y="96" fill="#F6F8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">The result ends in next steps, guidance, and sharable case output.</text>
    <text x="32" y="166" fill="#B5BDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500">Patient-facing Mistral guidance, account history, and email delivery make the workflow feel deployment-ready instead of hackathon-only.</text>
  </g>
</svg>
